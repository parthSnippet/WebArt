version: '3.8'

services:
  # Backend API
  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile
    container_name: mehndi-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    env_file:
      - ./Backend/.env.production
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - mehndi-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build: 
      context: ./Mehndi Web
      dockerfile: Dockerfile
    container_name: mehndi-frontend
    restart: unless-stopped
    ports:
      - "80:8080"
    networks:
      - mehndi-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB (for development/testing - use MongoDB Atlas in production)
  mongodb:
    image: mongo:6.0
    container_name: mehndi-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secure_password_123
      MONGO_INITDB_DATABASE: mehndi-booking
    volumes:
      - mongodb_data:/data/db
      - ./Backend/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - mehndi-network

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: mehndi-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - mehndi-network
    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data:
  backend_uploads:

networks:
  mehndi-network:
    driver: bridge